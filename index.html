<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sampling Room Clearance - B.14</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&family=Sarabun:wght@300;400;500;600;700&display=swap" />
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
      min-height: 100vh;
    }
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #loadingOverlay.active { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1e40af;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .direction-btn { transition: all 0.3s ease; cursor: pointer; }
    .direction-btn.active-in {
      background: linear-gradient(135deg, #1e40af, #1e3a8a);
      border-color: #1e3a8a; color: #ffffff;
      box-shadow: 0 2px 12px rgba(30, 64, 175, 0.4);
    }
    .direction-btn.active-out {
      background: linear-gradient(135deg, #172554, #1e3a8a);
      border-color: #172554; color: #ffffff;
      box-shadow: 0 2px 12px rgba(23, 37, 84, 0.4);
    }
    .direction-btn:not(.active-in):not(.active-out) {
      background: rgba(255, 255, 255, 0.8);
      border-color: #bfdbfe; color: #1e40af;
    }
    .form-container { transition: all 0.3s ease; border-top: 4px solid #1e3a8a; }
    .qr-modal, .history-modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      z-index: 50; justify-content: center; align-items: center;
    }
    .qr-modal.active, .history-modal.active { display: flex; }
    .history-modal { align-items: flex-start; padding-top: 2rem; overflow-y: auto; }
    .required-star { color: #ef4444; margin-left: 2px; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
  </style>
</head>
<body class="min-h-screen">
  <div id="loadingOverlay"><div class="spinner mb-4"></div><p class="text-blue-900 font-medium">กำลังส่งข้อมูลไปยัง Google Sheets...</p></div>

  <header class="bg-white/90 backdrop-blur-md shadow-md border-b border-blue-200">
    <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-start">
      <div>
        <span class="text-xs font-semibold text-blue-700 uppercase tracking-wider">Checklist by QAP</span>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold text-blue-900">Sampling Room Clearance – B.14</h1>
          <button onclick="showStatus()" class="flex items-center gap-2 px-4 py-2 bg-blue-700 text-white rounded-xl shadow-md text-sm">
            <span class="material-symbols-rounded text-lg">visibility</span> Status
          </button>
        </div>
        <p class="text-sm text-blue-600/70 mt-1">แบบฟอร์มตรวจสอบการเข้า-ออกห้องสุ่มตัวอย่าง</p>
      </div>
      <div class="relative">
        <button onclick="toggleDropdown()" class="text-blue-700 p-2 rounded hover:bg-blue-50">
          <span class="material-symbols-rounded">more_vert</span>
        </button>
        <div id="dropdownMenu" class="hidden absolute right-0 mt-1 w-48 bg-white rounded-lg shadow-lg border border-blue-100 z-10 py-1">
          <button onclick="showHistory(); toggleDropdown()" class="flex items-center gap-2 w-full px-4 py-2 text-sm text-blue-800 hover:bg-blue-50">
            <span class="material-symbols-rounded text-lg">history</span> ประวัติ
          </button>
          <button onclick="exportToExcel(); toggleDropdown()" class="flex items-center gap-2 w-full px-4 py-2 text-sm text-blue-800 hover:bg-blue-50">
            <span class="material-symbols-rounded text-lg">download</span> ส่งออก Excel
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <div class="bg-white/90 rounded-2xl shadow-xl overflow-hidden form-container border border-sky-200/50" id="formContainer">
      <div class="p-4 border-b border-sky-100 flex gap-3">
        <button id="btnIn" onclick="setDirection('in')" class="direction-btn active-in flex-1 py-4 rounded-xl border-2"><b>เข้า (IN)</b></button>
        <button id="btnOut" onclick="setDirection('out')" class="direction-btn flex-1 py-4 rounded-xl border-2"><b>ออก (OUT)</b></button>
      </div>

      <div class="p-4 space-y-5">
        <div>
          <label class="text-sm font-semibold text-blue-900">Material Code <span class="required-star">*</span></label>
          <div class="flex gap-2 mt-2">
            <input type="text" id="materialDesc" class="flex-1 border border-blue-200 rounded-lg px-4 py-3 text-sm">
            <button onclick="showQRScanner()" class="px-4 py-3 border-2 border-blue-700 text-blue-700 rounded-lg hover:bg-blue-50 text-sm font-medium">สแกน QR</button>
          </div>
        </div>
        <div>
          <label class="text-sm font-semibold text-blue-900">Batch No. <span class="required-star">*</span></label>
          <input type="text" id="batchNo" class="w-full border border-blue-200 rounded-lg px-4 py-3 text-sm mt-2">
        </div>
        <div>
          <label class="text-sm font-semibold text-blue-900" id="samplingSizeLabel">Sampling Size (เข้า) <span class="required-star">*</span></label>
          <p class="text-xs text-blue-600/70" id="samplingSizeSublabel">จำนวนการตรวจสอบ (กล่อง/ชิ้น)</p>
          <input type="number" id="samplingSize" class="w-full border border-blue-200 rounded-lg px-4 py-3 text-sm mt-2">
        </div>
        <div id="sampleUsageField" class="hidden">
          <label class="text-sm font-semibold text-blue-900">Sample Usage (ชิ้น) <span class="required-star">*</span></label>
          <input type="number" id="sampleUsage" class="w-full border border-blue-200 rounded-lg px-4 py-3 text-sm mt-2">
        </div>
        <div>
          <label class="text-sm font-semibold text-blue-900">Inspect by <span class="required-star">*</span></label>
          <input type="text" id="inspectBy" class="w-full border border-blue-200 rounded-lg px-4 py-3 text-sm mt-2">
        </div>
        <div>
          <label class="text-sm font-semibold text-blue-900">หมายเหตุ (ถ้ามี)</label>
          <input type="text" id="remarks" class="w-full border border-blue-200 rounded-lg px-4 py-3 text-sm mt-2">
        </div>
      </div>
      <div class="p-4 border-t border-blue-100">
        <button onclick="submitForm()" class="submit-btn w-full bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-blue-800">Submit</button>
      </div>
    </div>
    <div id="error-message" class="text-red-600 text-sm mt-2 hidden bg-red-50 border border-red-200 rounded-lg px-4 py-3"></div>
    <div id="success-message" class="text-green-700 text-sm mt-2 hidden bg-green-50 border border-green-200 rounded-lg px-4 py-3"></div>
  </main>

  <!-- Modals -->
  <div id="qrModal" class="qr-modal">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4">
      <div class="flex justify-between items-center mb-4"><h3 class="font-bold">สแกน QR Code</h3><button onclick="closeQRScanner()"><span class="material-symbols-rounded">close</span></button></div>
      <div id="reader" style="width: 100%;"></div>
      <div id="qrManualMode" class="mt-4"><input type="text" id="manualQRInput" placeholder="Material Code" class="w-full border rounded p-2 mb-2"></div>
      <button onclick="confirmQRScan()" class="w-full bg-blue-600 text-white py-2 rounded mt-2">ยืนยัน</button>
    </div>
  </div>

  <div id="historyModal" class="history-modal">
    <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full mx-4 p-4">
      <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">ประวัติการบันทึก</h3><button onclick="closeHistory()"><span class="material-symbols-rounded">close</span></button></div>
      <div id="historyContent" class="overflow-x-auto text-sm"></div>
    </div>
  </div>

  <script>
    let currentDirection = 'in';
    let records = [];
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_SWzQSsCuFGZDb9S3IJnIgFfcuOMtYlVmTMAhNtwjl6r6ZwuMG1Erl8cPgyviwNg3/exec';

    window.onload = () => loadRecords();

    function setDirection(dir) {
      currentDirection = dir;
      document.getElementById('btnIn').className = dir === 'in' ? 'direction-btn active-in flex-1 py-4 rounded-xl border-2' : 'direction-btn flex-1 py-4 rounded-xl border-2';
      document.getElementById('btnOut').className = dir === 'out' ? 'direction-btn active-out flex-1 py-4 rounded-xl border-2' : 'direction-btn flex-1 py-4 rounded-xl border-2';
      document.getElementById('sampleUsageField').classList.toggle('hidden', dir === 'in');
      document.getElementById('samplingSizeLabel').textContent = dir === 'in' ? 'Sampling Size (เข้า)' : 'Sampling Size (ออก)';
    }

    async function submitForm() {
      const data = {
        material: document.getElementById('materialDesc').value.trim(),
        batch: document.getElementById('batchNo').value.trim(),
        size: document.getElementById('samplingSize').value,
        usage: document.getElementById('sampleUsage').value,
        inspector: document.getElementById('inspectBy').value.trim(),
        remarks: document.getElementById('remarks').value.trim()
      };

      if(!data.material || !data.batch || !data.size || !data.inspector) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

      const payload = {
        "Material Code": data.material,
        "Batch No.": data.batch,
        "Direction(ทิศทาง)": currentDirection === 'in' ? 'เข้า (IN)' : 'ออก (OUT)',
        "Sampling Size (เข้า)": currentDirection === 'in' ? data.size : '',
        "Sampling Size (ออก)": currentDirection === 'out' ? data.size : '',
        "Sample Usage (ชิ้น)": currentDirection === 'out' ? data.usage : '',
        "Inspect by (ผู้ตรวจสอบ)": data.inspector,
        "หมายเหตุ(ถ้ามี)": data.remarks
      };

      document.getElementById('loadingOverlay').classList.add('active');
      try {
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert('บันทึกสำเร็จ!');
        saveLocal(payload);
        clearForm();
      } catch(e) { alert('เกิดข้อผิดพลาด'); }
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    function saveLocal(data) {
      let history = JSON.parse(localStorage.getItem('history_b14') || '[]');
      history.unshift({...data, timestamp: new Date().toISOString()});
      localStorage.setItem('history_b14', JSON.stringify(history.slice(0, 100)));
      loadRecords();
    }

    function loadRecords() {
      records = JSON.parse(localStorage.getItem('history_b14') || '[]');
      renderHistory();
    }

    function renderHistory() {
      let html = '<table class="w-full border-collapse border"><thead><tr class="bg-blue-50"><th>เวลา</th><th>ทิศทาง</th><th>Material</th><th>Batch</th></tr></thead><tbody>';
      records.forEach(r => {
        html += `<tr><td>${new Date(r.timestamp).toLocaleString()}</td><td>${r["Direction(ทิศทาง)"]}</td><td>${r["Material Code"]}</td><td>${r["Batch No."]}</td></tr>`;
      });
      document.getElementById('historyContent').innerHTML = html + '</tbody></table>';
    }

    function clearForm() {
      ['materialDesc','batchNo','samplingSize','sampleUsage','inspectBy','remarks'].forEach(id => document.getElementById(id).value = '');
    }

    function toggleDropdown() { document.getElementById('dropdownMenu').classList.toggle('hidden'); }
    function showHistory() { document.getElementById('historyModal').classList.add('active'); }
    function closeHistory() { document.getElementById('historyModal').classList.remove('active'); }
    function showQRScanner() { document.getElementById('qrModal').classList.add('active'); startScanner(); }
    function closeQRScanner() { document.getElementById('qrModal').classList.remove('active'); stopScanner(); }

    let scanner = null;
    function startScanner() {
      scanner = new Html5Qrcode("reader");
      scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
        const p = txt.split(':');
        if(p.length >= 7) {
          document.getElementById('materialDesc').value = p[5];
          document.getElementById('batchNo').value = p[6];
        } else document.getElementById('materialDesc').value = txt;
        closeQRScanner();
      });
    }
    function stopScanner() { if(scanner) scanner.stop(); }
    function confirmQRScan() {
      const val = document.getElementById('manualQRInput').value;
      if(val) document.getElementById('materialDesc').value = val;
      closeQRScanner();
    }
  </script>
</body>
</html>
